  - title: "ROS 2 Vision System for Mobile Manipulation"
    title_zh: "面向移动操作机器人的 ROS 2 视觉系统"
    type: "featured-project"
    period: "Jan 2026 - May 2026"
    period_zh: "2026年1月—2026年5月"
    project_type: "Team Robotics Project"
    project_type_zh: "团队机器人项目"
    status: "completed"
    status_zh: "已完成"
    tech_stack: ["ROS 2 Jazzy", "Python", "OpenCV", "NumPy", "vision_msgs", "RViz", "RGB-D Perception"]
    description: "Developed the vision subsystem for a mobile manipulation platform that supports white-bin search, colored block detection, 3D localization, and pick-and-place integration."
    description_zh: "为移动操作机器人平台开发视觉子系统，实现白色料箱搜索、彩色积木检测和三维定位，并与抓取放置流程完成集成。"
    goal: "Build a ROS 2 perception pipeline that detects bins and colored blocks from RGB-D camera data, estimates their 3D poses, and provides reliable outputs for navigation and manipulation."
    goal_zh: "构建 ROS 2 感知流程，从 RGB-D 相机数据中检测料箱和彩色积木、估计三维位姿，并为导航与操作模块提供可靠的感知结果。"
    contribution: "I was responsible for the vision module in the team project. I implemented HSV-based blob detection, RGB-D projection into 3D, object classification for blocks and bins, temporal smoothing for stable detections, and RViz/debug tools to support system testing and integration."
    contribution_zh: "在团队项目中负责视觉模块，完成基于 HSV 的斑点检测、RGB-D 三维投影、积木与料箱分类及时间序列平滑，并开发 RViz 可视化和调试工具，支持系统测试与集成。"
    results:
      - "Published 2D detections and 3D object poses for downstream robotic tasks"
      - "Separated search mode white-bin detection from manipulation mode multi-color detection"
      - "Improved robustness with multi-frame confirmation and exponential moving average smoothing"
      - "Added debugging nodes for terminal summaries, RViz markers, and annotated images"
    results_zh:
      - "发布二维检测结果和物体三维位姿，供机器人下游任务调用"
      - "将搜索阶段的白色料箱检测与操作阶段的多色物体检测解耦"
      - "通过多帧确认和指数移动平均平滑提升检测稳定性"
      - "增加终端摘要、RViz 标记和图像标注等调试节点"
    achievements:
      - "Designed a modular ROS 2 package structure with launch files for different operating stages"
      - "Used aligned depth images and camera intrinsics to estimate object position and yaw"
      - "Implemented lightweight tracking logic to reduce false positives in noisy scenes"
      - "Documented the package clearly for reuse and future extension in the team system"
    achievements_zh:
      - "设计模块化 ROS 2 功能包结构，并为不同运行阶段配置 launch 文件"
      - "利用对齐深度图与相机内参估计物体位置及偏航角"
      - "实现轻量级跟踪逻辑，减少复杂场景中的误检"
      - "完善功能包文档，便于团队复用和后续扩展"
    media:
      - type: "video"
        src: "/assets/videos/main_pipeline_manual_active_web.mp4"
        caption: "Robot system proof video"
        caption_zh: "机器人系统运行验证视频"
      - type: "image"
        src: "/assets/videos/r1.png"
        caption: "ROS 2 vision package structure"
        caption_zh: "ROS 2 视觉功能包结构"
    github: "https://github.com/Picklerick313/AERO62520_Robotic_Systems_Design_Project"
    live_demo: "https://github.com/Picklerick313/AERO62520_Robotic_Systems_Design_Project/tree/main/Xy"

  - title: "RAG-based Historical Character Dialogue System"
    title_zh: "基于 RAG 的历史人物对话系统"
    type: "featured-project"  # 特殊类型，用于特殊样式
    period: "Dec 2024 - May 2025"
    period_zh: "2024年12月—2025年5月"
    project_type: "Personal Project"
    project_type_zh: "个人项目"
    status: "completed"
    status_zh: "已完成"
    tech_stack: ["Python", "BeautifulSoup", "BERT", "RoBERTa", "Weaviate", "Flask", "DeepSeek API", "GPT-SoVITS", "HTML/CSS/JavaScript"]
    description: "Developed an intelligent dialogue system enabling realistic interactions with historical figure Sun Ce by integrating language modeling, knowledge retrieval, and speech synthesis technologies."
    description_zh: "融合语言模型、知识检索与语音合成技术，开发以历史人物孙策为原型的智能对话系统，提升角色对话的真实感与史实一致性。"
    achievements:
      - "Built multi-source data pipeline by crawling and cleaning content from historical texts with alias disambiguation"
      - "Created knowledge retrieval system using SentenceTransformer, achieving 30% latency reduction under high concurrency"
      - "Designed RAG pipeline with role-specific prompt templates for historically accurate responses"
      - "Integrated GPT-SoVITS for real-time text-to-speech conversion"
      - "Developed responsive web interface with user feedback mechanisms"
    achievements_zh:
      - "通过抓取和清洗多类历史文本构建数据流程，并处理人物别名消歧"
      - "使用 SentenceTransformer 构建知识检索系统，高并发场景下延迟降低 30%"
      - "设计结合角色专属提示模板的 RAG 流程，提高回答的史实准确性"
      - "集成 GPT-SoVITS，实现实时文本转语音"
      - "开发响应式 Web 界面及用户反馈机制"
