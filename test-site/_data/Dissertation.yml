subject: MSc Dissertation
subject_zh: 硕士论文
listing-order: 2.5
icon: "/assets/img/flask.svg"
contents:
  - title: "Reliability of ROS 2 Navigation under LiDAR Faults"
    title_zh: "LiDAR 故障下的 ROS 2 导航可靠性"
    period: "2026"
    period_zh: "2026年"
    project_type: "MSc Robotics Dissertation"
    project_type_zh: "机器人学硕士论文"
    status: "Completed"
    status_zh: "已完成"
    summary: "A controlled fault-injection and evaluation framework for tracing how LiDAR degradation propagates through ROS 2 Nav2—from sensing and costmaps to planning, control, robot motion, and mission outcome."
    summary_zh: "构建受控故障注入与评估框架，追踪 LiDAR 数据退化如何通过 ROS 2 Nav2 从感知与代价地图传播至规划、控制、机器人运动和最终任务结果。"
    metrics:
      - value: "216"
        label: "navigation runs"
        label_zh: "次导航运行"
      - value: "108"
        label: "matched pairs"
        label_zh: "组成对实验"
      - value: "9"
        label: "BARN environments"
        label_zh: "个 BARN 环境"
    pipeline:
      - label: "LiDAR"
        label_zh: "LiDAR"
      - label: "Costmaps"
        label_zh: "代价地图"
      - label: "Planning & Control"
        label_zh: "规划与控制"
      - label: "Robot Motion"
        label_zh: "机器人运动"
      - label: "Mission Outcome"
        label_zh: "任务结果"
    problem: "A navigation task can still report success while becoming slower, less stable, or more dependent on replanning. Success rate alone can hide meaningful reliability loss."
    problem_zh: "导航任务即使最终成功，也可能变慢、变得不稳定或更加依赖重规划；仅观察成功率会掩盖重要的可靠性损失。"
    methods:
      - "Injected configurable frontal LiDAR masking and intermittent sector dropout."
      - "Randomised baseline/fault order within matched runs in the same BARN world."
      - "Observed scan behaviour, costmaps, planner/controller activity, velocity commands, motion, and mission outcome."
      - "Used world-cluster bootstrap intervals, timeout-aware sensitivity analysis, and hierarchical Bayesian modelling."
    methods_zh:
      - "注入可配置的正面 LiDAR 遮挡和间歇扇区数据丢失。"
      - "在同一 BARN 环境内匹配 baseline 与 fault，并随机化成对运行顺序。"
      - "观测扫描数据、代价地图、规划/控制活动、速度指令、机器人运动和任务结果。"
      - "采用按环境聚类的 bootstrap 区间、超时敏感性分析和分层 Bayesian 建模。"
    contributions:
      - "ROS 2 fault-injection nodes and fault-specific recovery prototypes"
      - "Resumable paired campaign orchestration, cleanup, logging, and evidence tracking"
      - "Cross-layer instrumentation and rosbag2/MCAP trace analysis"
      - "Statistical analysis, classifier experiments, and reproducible research assets"
    contributions_zh:
      - "ROS 2 故障注入节点与按故障类型设计的恢复原型"
      - "支持断点恢复的成对实验编排、进程清理、日志记录与证据追踪"
      - "跨层观测以及 rosbag2/MCAP trace 分析"
      - "统计分析、分类器实验和可复现研究材料整理"
    results:
      - fault: "Frontal masking"
        fault_zh: "正面遮挡"
        value: "+5.97 s"
        interval: "95% CI [3.36, 8.46]"
      - fault: "Structured dropout"
        fault_zh: "结构化数据丢失"
        value: "+4.77 s"
        interval: "95% CI [2.11, 7.03]"
    result_note: "Both primary estimates compare matched pairs in which baseline and fault runs reached the goal, showing measurable degradation hidden by a top-level success label."
    result_note_zh: "两项主结果均比较 baseline 与 fault 都成功到达目标的成对任务，说明顶层“成功”状态仍可能掩盖可测量的性能退化。"
    result_figure: "/assets/img/dissertation-completion-time.svg"
    result_caption: "Matched-success completion-time increases with world-cluster bootstrap intervals; all-pair capped estimates are shown as sensitivity analysis."
    result_caption_zh: "成功任务配对的完成时间增量及按环境聚类的 bootstrap 区间；右侧同时给出包含全部配对的上限敏感性分析。"
    tech_stack: ["ROS 2 Jazzy", "Nav2", "Gazebo Harmonic", "Clearpath Jackal", "BARN", "Python", "PyMC", "rosbag2 / MCAP"]
    attribution: "BARN worlds and the base ROS 2 simulation originate from the upstream BARN Challenge. The fault models, injection and recovery nodes, experiment orchestration, tracing, statistical analysis, and curated evidence were developed for this dissertation."
    attribution_zh: "BARN 环境和基础 ROS 2 仿真来自上游 BARN Challenge；本论文中的故障模型、注入与恢复节点、实验编排、传播追踪、统计分析和证据整理均为本项目完成。"
    github: "https://github.com/XuYu-kyra/BARNnavigation"
    evidence: "https://github.com/XuYu-kyra/BARNnavigation/tree/master/dissertation_evidence_index"
